    <dl class="container">
        {% for item in crMatrix.items %}
        <dt><button onclick="accordion('{{ item.id }}')" class="button is-fullwidth has-background-info-dark has-text-white is-justify-content-flex-start">{{ item.name }}</button></dt>
        
      <dd id="{{ item.id }}" class="container is-hidden">
        <h4>Description</h4>
        <p>{{ item.description }}</p>
        <h4>Search</h4>
        <p>{{ item.search }}</p>
        <h4>Appraisal</h4>
        <p>{{ item.appraisal }}</p>
        <h4>Synthesis</h4>
        <p>{{ item.synthesis }}</p>
        <h4>Analysis</h4>
        <p>{{ item.analysis }}</p>
    </dd>    
    {% endfor %}
    </dl>
