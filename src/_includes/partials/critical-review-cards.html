{% for group in crMatrix.items|batch(2) %}
<div class="columns is-multiline">
    {% for item in group %}
    <div class="column is-half-desktop is-full-mobile">
<div class="card">
   <header class="has-background-info"> <h4>{{ item.name }}</h4></header>
   <p><strong>Description</strong>: <br>{{ item.description }} </p>
   <p><strong>Search</strong>: <br>{{ item.search }}</p>
  </div>
</div>
{% endfor %}
</div>
{% endfor %}
