
{% for item in crMatrix.items %}
<div class="card" id="{{ item.id }}">

    <header class="card-header has-background-dark">
      <p class="card-header-title has-text-white">{{ item.name }}</p>
    </header>
    
    <div class="tabs is-boxed is-fullwidth">
      <ul>
        <li class="is-active"><a onclick="openMatrix('{{ item.id }}Desc', this)"><span>Description</span></a></li>
        <li><a onclick="openMatrix('{{ item.id }}Search', this)"><span>Search</span></a></li>
        <li><a onclick="openMatrix('{{ item.id }}App', this)"><span>Appraisal</span></a></li>
        <li><a onclick="openMatrix('{{ item.id }}Syn', this)"><span>Synthesis</span></a></li>
        <li><a onclick="openMatrix('{{ item.id }}Anls', this)"><span>Analysis</span></a></li>
      </ul>
    </div>
    
    <div class="matrix" id="{{ item.id }}Desc">
      <h4>Description</h4>
        <p >{{ item.description }}</p>
      </div>
      
      <div class="matrix is-hidden" id="{{ item.id }}Search">
        <h4>Search</h4>
        <p>{{ item.search }}</p>
      </div>
      
      <div class="matrix is-hidden " id="{{ item.id }}App">
        <h4>Appraisal</h4>
        <p>{{ item.appraisal }}</p>
      </div>
      
      <div class="matrix is-hidden " id="{{ item.id }}Syn">
        <h4>Synthesis</h4>
        <p>{{ item.synthesis }}</p>
      </div>
      
      <div class="matrix is-hidden " id="{{ item.id }}Anls">
        <h4>Analysis</h4>
        <p>{{ item.analysis }}</p>
      </div>
      </div>

      {% endfor %}
