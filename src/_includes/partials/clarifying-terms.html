<dl class="container">
    {% for item in clarifyTerms.items %}
	<dt><button onclick="accordion('{{ item.id }}')" class="button is-fullwidth has-background-info-dark has-text-white is-justify-content-flex-start">{{ item.term }}</button></dt>
	
  <dd id="{{ item.id }}" class="container is-hidden">
{{ item.description }}

<p><strong>Example: </strong></p>

{{ item.example }}
</dd>


{% endfor %}
</dl>
