<nav class="w3-sidebar w3-collapse w3-black" style="z-index:3;width:300px;" id="mySidebar"><br>
  <div class="w3-container">
    <a href="#" onclick="w3_close()" class="w3-hide-large w3-right w3-large w3-padding w3-hover-grey" title="close menu">
      <i class="fa fa-remove"></i>
    </a>
  </div>
  
  <div class="w3-container brand w3-border-bottom w3-border-grey w3-margin-right w3-margin-left">
    <h1>{{ site.tagline }}</h1>
  </div>

  <div class="w3-bar-block">
    <a href="/" 
       onclick="w3_close()" 
       class="w3-bar-item w3-button w3-padding {% if page.url == '/' %}w3-light-grey{% else %}w3-text-white{% endif %}">
       Home
    </a> 

    {% for item in collections.chapters %}
      <a href="{{ item.url }}" 
         onclick="w3_close()" 
         class="w3-bar-item w3-button w3-padding {% if item.url == page.url %}w3-light-grey{% else %}w3-text-white{% endif %}">
         {{ item.data.title }}
      </a> 
    {% endfor %}
  </div>
</nav>

<div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" title="close side menu" id="myOverlay"></div>
