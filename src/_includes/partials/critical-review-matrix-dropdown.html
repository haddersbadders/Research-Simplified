{% for item in crMatrix.items %}
<button onclick="accordion('{{ item.id }}')" class="button is-fullwidth is-justify-content-flex-start">
    <h3>{{ item.name }}</h3></button>
    
    <div id="{{ item.id }}" class="container is-hidden">
      <div class="card">
        <h4>Description</h4>
        <p>{{ item.description }}</p>
    </div>
    <div class="card">
        <h4>Search</h4>
        <p>{{ item.search }}</p>
    </div>

        <div class="card">
        <h4>Appraisal</h4>
        <p>{{ item.appraisal }}</p>
    </div>

        <div class="card">
        <h4>Synthesis</h4>
        <p>{{ item.synthesis }}</p>
    </div>

        <div class="card">
        <h4>Analysis</h4>
        <p>{{ item.analysis }}</p>
    </div>
    </div>
    
    {% endfor %}
