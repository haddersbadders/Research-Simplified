<h3>Table of Contents</h3>
<ul class="menu-list">

{% for item in collections.chapters %}

    <li>
      <a href="{{ item.url }}">
        <img src="{{ item.data.teaser.icon }}" alt="{{ item.data.teaser.alt }}" class="is-rounded is-hidden-mobile" style="width:110px" /> </a>
        
        <a href="{{ item.url }}"><h3>Chapter {{ item.data.displayOrder }}: {{ item.data.title }}</h3></a>
        <span>{{ item.data.teaser.slug }}</span>
     
    </li>

{% endfor %}
</ul>
