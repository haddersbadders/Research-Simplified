<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ title }} | {{ site.title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/css/bulma.min.css' | url }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body, h1, h2, h3, h4, h5, h6 { font-family: "Raleway", sans-serif }
        /* Temporary padding for the sidebar in desktop view */
        @media screen and (min-width: 1024px) {
            .main-content { padding-left: 1.5rem; }
        }
    </style>
    <link rel="stylesheet" href="{{ '/css/custom.css' | url }}">
</head>
<body class="has-background-light">
    <!-- Navbar for Mobile -->
    <nav class="navbar is-hidden-desktop is-black" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="/">
                <strong>{{ site.tagline }}</strong>
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mobileNavbar">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div id="mobileNavbar" class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item">Home</a>
                {% for item in collections.chapters %}
                    <a href="{{ item.url }}" class="navbar-item">{{ item.data.title }}</a>
                {% endfor %}
            </div>
        </div>
    </nav>

    <div class="columns is-gapless is-marginless">
        <!-- Sidebar for Desktop -->
        <div class="column is-2 is-hidden-touch is-fullheight section is-black" style="min-height: 100vh; position: sticky; top: 0;">
            {% include "partials/nav.html" %}
        </div>

        <!-- Main Content -->
        <div class="column is-10 main-content">
            <section class="section">
                <div class="container">
                    {% block content %}{% endblock %}
                </div>
            </section>

            <!-- Footer -->
            <footer class="footer has-background-black has-text-centered has-text-white py-6">
                <div class="content">
                    <p>
                        <a href="https://www.sheffield.ac.uk/" title="The University of Sheffield" target="_blank" class="has-text-white is-underlined">University of Sheffield</a>
                    </p>
                </div>
            </footer>
        </div>
    </div>

    <script src="{{ '/js/index.js' | url }}"></script>
    <script>
        // Simple Bulma Burger Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
            if ($navbarBurgers.length > 0) {
                $navbarBurgers.forEach( el => {
                    el.addEventListener('click', () => {
                        const target = el.dataset.target;
                        const $target = document.getElementById(target);
                        el.classList.toggle('is-active');
                        $target.classList.toggle('is-active');
                    });
                });
            }
        });
    </script>
</body>
</html>
